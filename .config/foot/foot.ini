[main]
font=JetBrainsMono Nerd Font:size=14
pad=4x4
dpi-aware=yes

[csd]
preferred=server
size=0

[cursor]
style=block
blink=no

[colors-dark]
alpha=1.0
background=0a0a0a
foreground=d4d8dc

# Выделение текста
selection-foreground=f0f3f2
selection-background=295647

# Обычные цвета (ANSI 0-7)
regular0=15191d
regular1=e06c75
regular2=7ec7a2
regular3=e5c07b
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=abb2bf

# Яркие цвета (ANSI 8-15)
bright0=555d65
bright1=f07178
bright2=8edcb3
bright3=f3d38c
bright4=73baff
bright5=d48ce8
bright6=6cd1de
bright7=ffffff

[bell]
urgent=no
notify=no

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
