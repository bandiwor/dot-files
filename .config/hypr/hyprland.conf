env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1 

monitor=eDP-1,1920x1200@60,0x0,1
monitor=HDMI-A-1,1920x1080@165,1920x0,1

workspace = 6, monitor:HDMI-A-1, default:true
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

exec-once = qs -c noctalia-shell

# exec-once = nm-applet --indicator
# exec-once = blueman-applet

$mainMod = SUPER

$browser = brave
$terminal = kitty
$fileManager = yazi
$cursor = hyprctl setcursor "WinSur-dark-cursors" 20
$vpn = happ
$telegram = AyuGram
$music = /usr/bin/spotify

env = XCURSOR_THEME, WinSur-dark-cursors
env = XCURSOR_SIZE, 20
# exec-once = $cursor

bind = $mainMod, Q, killactive          
bind = $mainMod, R, exec, qs -c noctalia-shell ipc call launcher toggle
bind = $mainMod, M, exec, qs -c noctalia-shell ipc call powermenu toggle
bind = $mainMod, C, exec, $terminal     
bind = $mainMod, Escape, exit,              
bind = $mainMod, V, togglefloating,      
bind = $mainMod, E, exec, $terminal -e yazi ~

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, B, exec, $browser
bind = $mainMod, U, exec, $vpn
bind = $mainMod, T, exec, $telegram
bind = $mainMod, Y, exec, $music

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, minus, workspace, e-1
bind = $mainMod, equal, workspace, e+1
bind = $mainMod, Tab, workspace, previous

bind = $mainMod, grave, togglespecialworkspace
bind = $mainMod SHIFT, grave, movetoworkspace, special

bind = $mainMod, P, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod, S, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod SHIFT, P, exec, ls -t ~/Pictures/*.png | head -n 1 | xargs gthumb

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , xf86audioraisevolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , xf86audiolowervolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , xf86audiomute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = , xf86monbrightnessup, exec, brightnessctl set 5%+
bindel = , xf86monbrightnessdown, exec, brightnessctl set 5%-

# windowrule = match:class ^(nm-menu)$, float on
# windowrule = match:class ^(nm-menu)$, size 800 600
# windowrule = match:class ^(nm-menu)$, center 1
# 
# windowrule = match:class ^(com\.saivert\.pwvucontrol)$, float on
# windowrule = match:class ^(com\.saivert\.pwvucontrol)$, size 800 600
# windowrule = match:class ^(com\.saivert\.pwvucontrol)$, center 1
# 
# windowrule = match:class ^(blueman-manager)$, float on
# windowrule = match:class ^(blueman-manager)$, size 800 600
# windowrule = match:class ^(blueman-manager)$, center 1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(7F9FCCff) rgba(7FCCCCff) 45deg
    col.inactive_border = rgba(1F2932ff)
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle

    repeat_rate = 40
    repeat_delay = 250
}

decoration {
    rounding = 4
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(0D1216ee)
    }

    blur {
        enabled = true
    }
}

layerrule {
    name = noctalia_blur
    match:namespace = noctalia
    blur = on
    ignore_alpha = 0.5
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    background_color = 0x0E1115
    focus_on_activate = true
}

source = /home/kira/.config/hypr/noctalia/noctalia-colors.conf

