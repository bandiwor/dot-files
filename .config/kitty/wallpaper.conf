# OPACITY
background_opacity 0.0

font_family      JetBrainsMono Nerd Font
font_size        12.0

disable_ligatures never

enable_audio_bell no

cursor_shape block
cursor_stop_blinking yes
shell_integration enabled no-cursor

hide_window_decorations yes

tab_bar_background #c2d6c2
background #00cc00
foreground #cc00cc
#background #26362e
#foreground #dbf0e6

active_tab_foreground #f0faf5
active_tab_background #385748
active_tab_font_style bold

inactive_tab_foreground #85ad9a
inactive_tab_background #1d2a24
inactive_tab_font_style normal

confirm_os_window_close 0

